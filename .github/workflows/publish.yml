name: Publish

# Publishes to npm WITH provenance — a signed, public attestation linking the tarball to
# this exact commit + workflow run. For a package whose whole thesis is "verified, not
# asserted", shipping a build users can cryptographically trace back to its source is the
# same discipline applied to our own supply chain.
#
# Trigger: push a tag `vX.Y.Z` that matches package.json's version (the guard enforces
# the match).
#
# Auth is npm TRUSTED PUBLISHING (OIDC) — no long-lived credential. The runner exchanges
# the short-lived GitHub OIDC token (hence `id-token: write` below) for a scoped npm
# publish token, so there is no `NPM_TOKEN` secret to leak, rotate, or over-scope. That
# is the same argument this package makes about model providers, applied to itself: a
# standing secret in CI is a claim that it has never been exfiltrated; OIDC is a
# credential that cannot outlive the run that used it.
#
# One-time setup on npmjs.com: package → Settings → Trusted Publisher → GitHub Actions,
# with repository `privateer-agent/pi-privacy` and workflow `publish.yml`. Without that
# registration npm rejects the exchange and this job fails closed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      # .nvmrc pins Node 22.19.0, which ships npm 10.9.3 — too old to perform the OIDC
      # exchange (needs npm >= 11.5.1). Upgrade the CLI only; the Node version stays
      # exactly what the package declares it supports.
      #
      # Pinned to the 11.x line, NOT @latest: npm 12 requires Node ^22.22.2, so `@latest`
      # silently became uninstallable on our pinned runtime the moment it shipped. A
      # release pipeline that breaks when an unrelated project cuts a major is not a
      # pipeline you can trust to be there on release day.
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@11
          npm --version

      - name: Install (locked)
        run: npm ci

      - name: Guard — tag matches package.json version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "publishing v$PKG"

      # Idempotency guard: if this exact version is already on npm (e.g. it was
      # published manually, or a tag is re-pushed), SKIP the publish instead of failing —
      # npm rejects republishing an existing version, and a red run on a no-op is noise.
      - name: Check whether this version is already published
        id: published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VER is already on npm — skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.published.outputs.already == 'false'
        run: npm run typecheck

      - name: Unit tests
        if: steps.published.outputs.already == 'false'
        run: npm test

      # No NODE_AUTH_TOKEN: auth comes from the OIDC exchange (see the header). Leaving a
      # token in place as a "fallback" would defeat the point — the standing credential
      # would still exist, and a misconfigured publisher would silently fall back to it
      # instead of failing closed where you can see it.
      - name: Publish with provenance
        if: steps.published.outputs.already == 'false'
        run: npm publish --provenance --access public
